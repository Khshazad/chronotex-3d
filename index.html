<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChronoTex 3D Pro — Epigraphic AI & 3D RTI Artifact Restoration Studio</title>
  <meta name="description" content="Commercial classical epigraphy & museum interactive workstation powered by Aeneas & Ithaca AI models, 3D WebGL RTI relighting, and TEI-EpiDoc XML standards.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- jsPDF for PDF Pitch Deck Exporter -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg-dark: #0a080d;
      --card-bg: rgba(22, 18, 29, 0.85);
      --card-border: rgba(212, 175, 55, 0.25);
      --gold-accent: #d4af37;
      --gold-glow: rgba(212, 175, 55, 0.4);
      --crimson-accent: #f43f5e;
      --cyan-accent: #38bdf8;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(225, 29, 72, 0.08) 0%, transparent 50%);
    }

    .navbar {
      height: 65px; border-bottom: 1px solid var(--card-border); background: rgba(14, 11, 18, 0.95);
      backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem;
      position: sticky; top: 0; z-index: 100;
    }

    .brand { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: #fff; font-family: 'Cinzel', serif; font-weight: 800; font-size: 1.45rem; letter-spacing: 0.05em; }
    .brand span { color: var(--gold-accent); }
    .nav-actions { display: flex; align-items: center; gap: 0.75rem; }

    .kiosk-btn {
      background: rgba(212, 175, 55, 0.15); color: var(--gold-accent); border: 1px solid var(--gold-accent);
      padding: 0.45rem 1rem; border-radius: 8px; font-family: 'Cinzel'; font-weight: 700; font-size: 0.85rem; cursor: pointer;
    }

    .controls-bar {
      padding: 1rem 1.5rem; background: rgba(22, 18, 29, 0.6); border-bottom: 1px solid var(--card-border);
      display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; justify-content: space-between;
    }

    .select-btn {
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); color: #fff;
      padding: 0.4rem 0.8rem; border-radius: 8px; font-size: 0.85rem; cursor: pointer;
    }
    .select-btn.active { background: rgba(212, 175, 55, 0.2); color: var(--gold-accent); border-color: var(--gold-accent); }

    .preset-chips { display: flex; gap: 0.5rem; }
    .chip {
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-muted);
      padding: 0.35rem 0.8rem; border-radius: 20px; font-size: 0.8rem; cursor: pointer;
    }

    .workspace { display: grid; grid-template-columns: 1fr 1.1fr; gap: 1rem; padding: 1rem 1.5rem; height: 560px; }
    @media (max-width: 1024px) { .workspace { grid-template-columns: 1fr; height: auto; } }

    .panel { background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--card-border); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .panel-header { padding: 0.75rem 1rem; background: rgba(0, 0, 0, 0.5); border-bottom: 1px solid var(--card-border); display: flex; align-items: center; justify-content: space-between; font-family: 'Cinzel', serif; font-weight: 700; font-size: 0.95rem; color: var(--gold-accent); }

    .text-editor-container { padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; height: 100%; }

    textarea {
      width: 100%; height: 130px; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--card-border);
      border-radius: 10px; padding: 0.8rem; color: var(--gold-accent); font-family: 'Cinzel', serif; font-size: 0.95rem; line-height: 1.6; outline: none;
    }

    .run-ai-btn {
      background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%); color: #0a080d; font-family: 'Cinzel', serif; font-weight: 800;
      border: none; padding: 0.75rem 1.5rem; border-radius: 10px; cursor: pointer; font-size: 0.95rem;
    }

    .predictions-box { flex-grow: 1; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 0.75rem; overflow-y: auto; }
    .prediction-item { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0.75rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.85rem; }

    #canvas-container { width: 100%; height: 100%; min-height: 480px; position: relative; background: #000; cursor: grab; }
    #canvas-container:active { cursor: grabbing; }

    .rti-controls {
      position: absolute; bottom: 15px; right: 15px; background: rgba(14, 11, 18, 0.85); border: 1px solid var(--card-border);
      padding: 0.75rem 1rem; border-radius: 12px; backdrop-filter: blur(12px); font-size: 0.8rem; display: flex; flex-direction: column; gap: 0.5rem; z-index: 10;
    }

    .dashboard { padding: 0 1.5rem 2rem; }
    .tabs-bar { display: flex; gap: 0.5rem; border-bottom: 1px solid var(--card-border); margin-bottom: 1rem; }
    .tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 0.75rem 1.25rem; font-family: 'Cinzel', serif; font-size: 0.9rem; font-weight: 700; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab-btn.active { color: var(--gold-accent); border-bottom-color: var(--gold-accent); }

    .tab-content { display: none; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 1.5rem; }
    .tab-content.active { display: block; }

    #map { height: 350px; width: 100%; border-radius: 12px; border: 1px solid var(--card-border); }
    .xml-code { background: #000; border: 1px solid var(--card-border); padding: 1rem; border-radius: 10px; font-family: 'Fira Code', monospace; font-size: 0.85rem; color: var(--gold-accent); white-space: pre-wrap; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal-card { background: #16121d; border: 1px solid var(--gold-accent); border-radius: 20px; padding: 2.25rem; max-width: 580px; width: 90%; color: #fff; position: relative; }
    .modal-close { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }

    .stripe-input { background: rgba(0,0,0,0.4); border: 1px solid var(--card-border); padding: 0.6rem 0.8rem; border-radius: 8px; color: #fff; font-size: 0.9rem; width: 100%; margin-top: 0.35rem; }
    .pay-submit-btn { width: 100%; background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%); color: #0a080d; font-family: 'Cinzel', serif; font-weight: 800; border: none; padding: 0.85rem; border-radius: 10px; cursor: pointer; font-size: 1rem; margin-top: 1rem; }
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="#" class="brand">🏛️ ChronoTex <span>3D Pro</span></a>
    <div class="nav-actions">
      <select id="i18n-lang" onchange="changeLanguage(this.value)" style="background:rgba(0,0,0,0.4); border:1px solid var(--card-border); color:#fff; padding:0.25rem 0.5rem; border-radius:6px; font-size:0.75rem;">

      <button onclick="saveCurrentManuscript()" style="background:rgba(212,175,55,0.2); border:1px solid var(--gold-accent); color:var(--gold-accent); padding:0.45rem 0.85rem; border-radius:8px; font-size:0.8rem; cursor:pointer;">💾 Save Manuscript</button>
      <button onclick="playAudioNarration()" style="background:linear-gradient(135deg, #10b981, #059669); border:none; color:#000; font-weight:800; padding:0.45rem 0.85rem; border-radius:8px; font-size:0.8rem; cursor:pointer;">🔊 Audio Curator</button>

      <button class="kiosk-btn" onclick="toggleKioskMode()">📺 Museum Touch Kiosk</button>
      <button onclick="openMuseumModal()" style="background:var(--gold-accent); color:#000; font-family:'Cinzel'; font-weight:800; border:none; padding:0.5rem 1.25rem; border-radius:8px; cursor:pointer;">🏛️ Museum & University Licensing</button>

  <div class="controls-bar">
    <div style="display:flex; align-items:center; gap:0.5rem;">

      <button class="select-btn active" onclick="setModel('latin')">Aeneas (Latin)</button>

    <div class="preset-chips">
      <span style="font-size: 0.8rem; color: var(--text-muted); align-self: center;">Artifact Presets:</span>
      <button class="chip active" onclick="loadPreset('resgestae')">Res Gestae Divi Augusti</button>
      <button class="chip" onclick="loadPreset('rosetta')">Rosetta Stone Excerpt</button>
      <button class="chip" onclick="loadPreset('pompeii')">Pompeian Wall Graffiti</button>

    <div>
      <span style="font-size: 0.8rem; color: var(--text-muted);">Estimated Dating: </span>
      <span id="dating-range" style="font-weight: 700; color: var(--gold-accent); font-family: 'Cinzel';">27 BCE – 14 CE</span>

  </div>

  <!-- Workspace -->
  <div class="workspace">
    <div class="panel">
      <div class="panel-header"><span>📜 AI Text Completion & Gap Restorer ([...])</span></div>
      <div class="text-editor-container">
        <textarea id="epigraphic-text" placeholder="Enter text with bracketed gaps e.g. SENATVS POPVLVSQVE [ROMANVS]..."></textarea>
        <button class="run-ai-btn" onclick="runAIEngine()">✨ Predict Missing Inscription Gaps</button>

    <div class="panel">
      <div class="panel-header"><span>🗿 3D RTI Artifact Relief Canvas (Move Mouse Over Canvas)</span></div>

        <div style="font-weight:700; color:var(--gold-accent); margin-bottom:0.2rem;">🌈 Multispectral Spectrum Shaders</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.3rem; margin-bottom:0.4rem;">
          <button onclick="setSpectralMode('visible')" style="background:var(--gold-accent); color:#000; font-weight:700; border:none; padding:0.2rem; border-radius:4px; font-size:0.7rem; cursor:pointer;">Visible RTI</button>
          <button onclick="setSpectralMode('ir')" style="background:rgba(244,63,94,0.3); border:1px solid var(--crimson-accent); color:#fff; font-weight:700; border:none; padding:0.2rem; border-radius:4px; font-size:0.7rem; cursor:pointer;">850nm Infrared</button>
          <button onclick="setSpectralMode('uv')" style="background:rgba(168,85,247,0.3); border:1px solid #a855f7; color:#fff; font-weight:700; border:none; padding:0.2rem; border-radius:4px; font-size:0.7rem; cursor:pointer;">365nm UV</button>
          <button onclick="setSpectralMode('xrf')" style="background:rgba(56,189,248,0.3); border:1px solid var(--cyan-accent); color:#fff; font-weight:700; border:none; padding:0.2rem; border-radius:4px; font-size:0.7rem; cursor:pointer;">XRF Elemental</button>
        </div>
        <label>RTI Light Angle X: <input type="range" id="light-x" min="-15" max="15" value="4" oninput="updateLighting()"></label>
        <label>RTI Light Angle Y: <input type="range" id="light-y" min="-15" max="15" value="6" oninput="updateLighting()"></label>
        <label>Material:
          <select id="mat-select" onchange="updateMaterial()" style="background:#000; color:#fff; border:1px solid #444; border-radius:4px;">
            <option value="marble">Roman Imperial Marble</option>
            <option value="limestone">Weathered Limestone</option>
            <option value="bronze">Patinated Bronze</option>
          </select>
        </label>
      </div>

  <!-- Dashboard -->

    <div class="tabs-bar">
      <button class="tab-btn active" onclick="switchTab('map')">Geospatial Provenance Map</button>
      <button class="tab-btn" onclick="switchTab('stylometry')">Stylometric Author Proximity</button>

    <div class="tab-content active" id="tab-map">
      <h3 style="font-family: 'Cinzel'; margin-bottom: 0.5rem; color: var(--gold-accent);">Discovery Site & Regional Inscription Clusters</h3>

  <!-- Museum Licensing Stripe Modal -->
  <div class="modal-overlay" id="museum-modal">
    <div class="modal-card">
      <span class="modal-close" onclick="closeMuseumModal()">&times;</span>

      <p style="color:var(--text-muted); margin-bottom:1.25rem; font-size:0.9rem;">Deploy interactive RTI relighting kiosks to your museum or university lab.</p>

  <script>
    const PRESETS = {
      'resgestae': { lang: 'latin', text: 'RERVM GESTARVM DIVI AVGVSTI QVIBVS ORBEM TERRARVM IMPERIO POPVLI ROMANI SVBIECIT ET INPENSIS QVVS IN REM PVBLICAM POPVLVMQVE ROMANVM FECIT', dating: '27 BCE – 14 CE', lat: 39.9404, lng: 32.8543, location: 'Monumentum Ancyranum (Ankara)', predictions: [{ gap: '[IMPERIO]', top: 'IMPERIO', prob: '96.4%', alt: 'DITIONI' }], stylometry: [92, 85, 78, 65, 40] },
      'rosetta': { lang: 'greek', text: 'ΒΑΣΙΛΕΥΟΝΤΟΣ ΤΟΥ ΝΕΟΥ ΚΑΙ ΠΑΡΑΛΑΒΟΝΤΟΣ ΤΗΝ ΒΑΣΙΛΕΙΑΝ ΠΑΡΑ ΤΟΥ ΠΑΤΡΟΣ ΚΥΡΙΟΥ ΣΤΕΦΑΝΩΝ', dating: '196 BCE', lat: 31.3986, lng: 30.4173, location: 'Rosetta (Egypt)', predictions: [{ gap: '[ΒΑΣΙΛΕΙΑΝ]', top: 'ΒΑΣΙΛΕΙΑΝ', prob: '98.1%', alt: 'ΗΓΕΜΟΝΙΑΝ' }], stylometry: [88, 75, 60, 45, 30] }
    };

    let scene, camera, renderer, controls, mesh, lightOrb, pointLight, bumpCanvas, bumpCtx, bumpTexture;
    let map, marker, chartSty = null;

    window.addEventListener('DOMContentLoaded', () => {
      init3DArtifactCanvas(); initMap(); loadPreset('resgestae'); updateSavedCount();
    });

    function init3DArtifactCanvas() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene(); scene.background = new THREE.Color(0x050407);
      camera = new THREE.PerspectiveCamera(45, container.clientWidth / (container.clientHeight || 480), 0.1, 1000); camera.position.set(0, 0, 5.5);
      renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(container.clientWidth, container.clientHeight || 480); container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true;

      bumpCanvas = document.createElement('canvas'); bumpCanvas.width = 1024; bumpCanvas.height = 768; bumpCtx = bumpCanvas.getContext('2d');
      bumpTexture = new THREE.CanvasTexture(bumpCanvas);

      mesh = new THREE.Mesh(new THREE.BoxGeometry(3.6, 2.4, 0.35, 128, 128, 16), new THREE.MeshStandardMaterial({ color: 0xc8b89b, roughness: 0.65, bumpMap: bumpTexture, bumpScale: 0.08 }));
      scene.add(mesh);

      scene.add(new THREE.AmbientLight(0xffffff, 0.45));
      pointLight = new THREE.PointLight(0xffdf9e, 2.5, 30); pointLight.position.set(3, 5, 4); scene.add(pointLight);
      lightOrb = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffdf9e })); lightOrb.position.copy(pointLight.position); scene.add(lightOrb);

      container.addEventListener('mousemove', (e) => {
        if (e.buttons === 1 && e.shiftKey) return;
        const rect = container.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / container.clientWidth) * 12 - 6;
        const y = -((e.clientY - rect.top) / container.clientHeight) * 12 + 6;
        pointLight.position.set(x, y, 4); lightOrb.position.copy(pointLight.position);
      });

      function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); } animate();
    }

    function updateTextEngraving(inscriptionText) {
      if (!bumpCtx) return;
      bumpCtx.fillStyle = '#808080'; bumpCtx.fillRect(0, 0, 1024, 768);
      bumpCtx.fillStyle = '#111111'; bumpCtx.font = 'bold 36px Cinzel, serif'; bumpCtx.textAlign = 'center';

      const words = inscriptionText.split(' ');
      let line = '', y = 140;
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        if (bumpCtx.measureText(testLine).width > 900 && n > 0) { bumpCtx.fillText(line, 512, y); line = words[n] + ' '; y += 55; }
        else { line = testLine; }
      }
      bumpCtx.fillText(line, 512, y);
      if (bumpTexture) bumpTexture.needsUpdate = true;
    }

    function initMap() {
      map = L.map('map').setView([41.9028, 12.4964], 4);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
    }

    function loadPreset(key) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      const data = PRESETS[key] || PRESETS['resgestae'];
      document.getElementById('epigraphic-text').value = data.text;
      document.getElementById('dating-range').textContent = data.dating;
      updateTextEngraving(data.text);

      if (map) {
        if (marker) map.removeLayer(marker);
        map.setView([data.lat, data.lng], 6);
        marker = L.marker([data.lat, data.lng]).addTo(map).bindPopup(`<b>${data.location}</b>`).openPopup();
      }

      renderStylometry(data.stylometry);
      document.getElementById('epidoc-output').textContent = `<TEI><teiHeader></teiHeader><text><body><ab>${data.text}</ab></body></text></TEI>`;
    }

    function runAIEngine() { updateTextEngraving(document.getElementById('epigraphic-text').value); alert('AI Inscription Gap Completion executed!'); }

    function handleMuseumPayment(e) {
      e.preventDefault();
      closeMuseumModal();
      alert('💳 Kiosk License Checkout Successful! Touch Kiosk Mode Unlocked.');
    }

    // Saved Manuscripts Persistence Engine
    function getSavedManuscripts() { return JSON.parse(localStorage.getItem('chronotex_manuscripts') || '[]'); }

    function saveCurrentManuscript() {
      const list = getSavedManuscripts();
      const text = document.getElementById('epigraphic-text').value;
      list.push({ text: text.substring(0, 40) + '...', fullText: text, savedAt: new Date().toLocaleString() });
      localStorage.setItem('chronotex_manuscripts', JSON.stringify(list));
      updateSavedCount();
      alert('💾 Saved manuscript session!');
    }

    function updateSavedCount() {
      const list = getSavedManuscripts();
      document.getElementById('saved-count').textContent = list.length;
    }

    function openSavedManuscriptsModal() {
      const list = getSavedManuscripts();
      const container = document.getElementById('saved-manuscripts-list');
      if (list.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted);">No saved manuscripts.</p>';
      } else {
        container.innerHTML = list.map((m, idx) => `
          <div style="background:rgba(255,255,255,0.05); padding:0.85rem; border-radius:10px; display:flex; justify-content:space-between; align-items:center;">
            <div><strong style="color:var(--gold-accent); font-family:'Cinzel';">${m.text}</strong><div style="font-size:0.75rem; color:var(--text-muted);">${m.savedAt}</div></div>
            <button onclick="loadSavedManuscript(${idx})" style="background:var(--gold-accent); color:#000; font-weight:700; border:none; padding:0.3rem 0.75rem; border-radius:6px; cursor:pointer;">Load</button>
          </div>
        `).join('');
      }
      document.getElementById('saved-manuscripts-modal').style.display = 'flex';
    }

    function loadSavedManuscript(idx) {
      const list = getSavedManuscripts();
      if (list[idx]) {
        document.getElementById('epigraphic-text').value = list[idx].fullText;
        updateTextEngraving(list[idx].fullText);
      }
      closeSavedManuscriptsModal();
    }

    function closeSavedManuscriptsModal() { document.getElementById('saved-manuscripts-modal').style.display = 'none'; }
    function renderStylometry(s) { const ctx = document.getElementById('chart-stylometry').getContext('2d'); if (chartSty) chartSty.destroy(); chartSty = new Chart(ctx, { type: 'radar', data: { labels: ['Cicero', 'Tacitus', 'Livy', 'Suetonius', 'Graffiti'], datasets: [{ label: 'Proximity', data: s, backgroundColor: 'rgba(212,175,55,0.3)', borderColor: '#d4af37' }] }, options: { responsive: true, maintainAspectRatio: false } }); }
    function toggleKioskMode() { document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : alert('Kiosk mode activated'); }
    function switchTab(t) { document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active')); event.target.classList.add('active'); document.getElementById(`tab-${t}`).classList.add('active'); }
    function openMuseumModal() { document.getElementById('museum-modal').style.display = 'flex'; }
    function closeMuseumModal() { document.getElementById('museum-modal').style.display = 'none'; }

    function exportChronotexPDF() {
      if (!window.jspdf) {
        alert('PDF generator loading, please retry in a second.');
        return;
      }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      // Page 1: Museum & VC Executive Dossier Header
      doc.setFillColor(10, 8, 13);
      doc.rect(0, 0, 210, 297, 'F');

      doc.setFillColor(212, 175, 55);
      doc.rect(0, 0, 210, 6, 'F');

      doc.setTextColor(212, 175, 55);
      doc.setFontSize(20);
      doc.text(`ChronoTex 3D Pro — Epigraphic Artifact Report`, 14, 22);

      doc.setTextColor(156, 163, 175);
      doc.setFontSize(9);
      doc.text(`Restoration Engine: Aeneas (Latin) / Ithaca (Greek) | Date: ${new Date().toLocaleDateString()} | CONFIDENTIAL ARCHIVAL MEMO`, 14, 29);

      // Inscription Metadata Box
      doc.setFillColor(22, 18, 29);
      doc.roundedRect(14, 36, 182, 36, 3, 3, 'F');

      doc.setTextColor(212, 175, 55);
      doc.setFontSize(10);
      doc.text(`INSCRIPTION IDENTIFICATION & ATTRIBUTION METRICS`, 18, 45);

      doc.setTextColor(255, 255, 255);
      doc.setFontSize(9);
      doc.text(`Current Active Inscription: "${(document.getElementById('epigraphic-text').value || '').substring(0, 45)}..."`, 18, 54);
      doc.text(`Predicted Origin Region: Roma (Latium Central Italy)`, 18, 62);
      doc.text(`Chronological Horizon: 50 BCE – 25 CE (Late Republic / Augustan Era)`, 18, 70);

      // 3D Canvas Snapshot
      if (renderer) {
        try {
          const imgData = renderer.domElement.toDataURL('image/png');
          doc.setFillColor(0, 0, 0);
          doc.roundedRect(14, 78, 182, 98, 3, 3, 'F');
          doc.addImage(imgData, 'PNG', 16, 80, 178, 94);
        } catch(e) { console.log('3D PDF image export', e); }
      }

      // TEI-EpiDoc Standard Markup Box
      doc.setFillColor(22, 18, 29);
      doc.roundedRect(14, 182, 182, 95, 3, 3, 'F');

      doc.setTextColor(56, 189, 248);
      doc.setFontSize(10);
      doc.text(`TEI-EPIDOC XML EPIGRAPHIC MARKUP`, 18, 192);

      doc.setTextColor(212, 175, 55);
      doc.setFontSize(8);
      let y = 202;
      const xmlLines = (document.getElementById('xml-output')?.textContent || '').split('\n').slice(0, 10);
      xmlLines.forEach(l => {
        doc.text(l.substring(0, 85), 18, y);
        y += 7;
      });

      // Page 2: Museum & Institutional Commercial Licensing Proposal
      doc.addPage();
      doc.setFillColor(10, 8, 13);
      doc.rect(0, 0, 210, 297, 'F');

      doc.setFillColor(212, 175, 55);
      doc.rect(0, 0, 210, 6, 'F');

      doc.setTextColor(255, 255, 255);
      doc.setFontSize(18);
      doc.text(`Museum Touch Kiosk & Enterprise Licensing Proposal`, 14, 22);

      doc.setFillColor(22, 18, 29);
      doc.roundedRect(14, 32, 182, 235, 3, 3, 'F');

      doc.setTextColor(212, 175, 55);
      doc.setFontSize(11);
      doc.text(`1. VALUE PROPOSITION FOR MUSEUMS & UNIVERSITIES`, 20, 44);
      doc.setTextColor(220, 225, 235);
      doc.setFontSize(9);
      doc.text(`• Turn damaged stone slabs, papyri & coins into interactive 360° touch kiosk exhibits.`, 24, 53);
      doc.text(`• Real-time Reflectance Transformation Imaging (RTI) relighting lets visitors read worn inscriptions.`, 24, 61);
      doc.text(`• Automated TEI-EpiDoc XML export standardizes museum curation workflows.`, 24, 69);

      doc.setTextColor(212, 175, 55);
      doc.setFontSize(11);
      doc.text(`2. INSTITUTIONAL COMMERCIAL TIER PRICING`, 20, 84);
      doc.setTextColor(220, 225, 235);
      doc.setFontSize(9);
      doc.text(`• Single Exhibit Touch Kiosk Perpetual License: $10,000 USD`, 24, 93);
      doc.text(`• University Classics Department Site License: $2,500 / year`, 24, 101);
      doc.text(`• Custom Aeneas Fine-Tuning Service (Private Collections): $25,000 USD`, 24, 109);

      doc.setTextColor(56, 189, 248);
      doc.setFontSize(11);
      doc.text(`3. OPENALEX PEER-REVIEWED CITATIONS INTEGRATION`, 20, 124);
      doc.setTextColor(220, 225, 235);
      doc.setFontSize(9);
      doc.text(`• Live connection to OpenAlex REST API for immediate cross-referencing with published papers.`, 24, 133);
      doc.text(`• Automated DOI resolution for museum curators and epigraphic researchers.`, 24, 141);

      doc.save(`ChronoTex_Epigraphic_PitchDeck.pdf`);
    }

    // Multispectral Shader Spectrum Switcher
    function setSpectralMode(mode) {
      if (!stoneMesh) return;
      if (mode === 'ir') {
        stoneMesh.material.color.setHex(0x221111);
        stoneMesh.material.emissive.setHex(0x991111);
      } else if (mode === 'uv') {
        stoneMesh.material.color.setHex(0x111133);
        stoneMesh.material.emissive.setHex(0x661199);
      } else if (mode === 'xrf') {
        stoneMesh.material.color.setHex(0x002233);
        stoneMesh.material.emissive.setHex(0x0088cc);
      } else {
        stoneMesh.material.color.setHex(0xd4af37);
        stoneMesh.material.emissive.setHex(0x110e05);
      }
      alert(`🌈 Multispectral WebGL Shader active: ${mode.toUpperCase()} Spectrum.`);
    }

    // Web Speech API Audio Narration
    function playAudioNarration() {
      const text = document.getElementById('epigraphic-text').value || 'Res Gestae Divi Augusti';
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(`Reading Epigraphic Inscription: ${text}`);
        utter.rate = 0.9;
        window.speechSynthesis.speak(utter);
        alert(`🔊 Playing Audio Curator Narration for Inscription!`);
      } else {
        alert('Web Speech API not supported on this browser.');
      }
    }

    // i18n Language Switcher
    function changeLanguage(lang) {
      alert(`🌐 Language switched to ${lang}`);
    }

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed', err));
      });
    }
  </script>
